set -g mouse on

set -g status-position top

set -g status-left " 🚀 Mission "
set -g status-right "#H | %I:%M %p"

set -g history-limit 50000

# =============================================================================
# ~/.tmux.conf — proj workspace integration additions
# =============================================================================

# ---------------------------------------------------------------------------
# Status bar — shows workspace name and type, never raw paths
# ---------------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom

# Colours (adjust to match your terminal theme)
set -g status-style                 "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-style            "bg=#1a1b26,fg=#7aa2f7,bold"
set -g status-right-style           "bg=#1a1b26,fg=#565f89"
set -g window-status-current-style  "bg=#2f3549,fg=#7aa2f7,bold"
set -g window-status-style          "bg=#1a1b26,fg=#565f89"
set -g pane-border-style            "fg=#2f3549"
set -g pane-active-border-style     "fg=#7aa2f7"

# Left: workspace name + type
set -g status-left-length 40
set -g status-left "#{?#{@proj_name}, #[fg=#bb9af7 bold]#{@proj_name}#[fg=#565f89 nobold] #{@proj_type} ,#[fg=#565f89] (no proj) }  "

# Right: date/time + host
set -g status-right-length 60
set -g status-right "#[fg=#565f89]%H:%M  %d %b  #[fg=#3b4261]#{host_short}"

set -g automatic-rename off
set -g allow-rename     off

set -g window-status-format         " #{window_index}:#{window_name} "
set -g window-status-current-format " #{window_index}:#{window_name} "

# ---------------------------------------------------------------------------
# Sensible defaults
# ---------------------------------------------------------------------------
set -g history-limit 10000
set -g mouse on
set -g base-index      1
set -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g  default-terminal   "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ---------------------------------------------------------------------------
# Keybindings — proj integration
# ---------------------------------------------------------------------------

# proj dashboard popup (prefix + P)
bind-key P display-popup -E -w 90% -h 90% "proj dashboard"

# Quick project status with prefix + S
bind S run-shell "proj status | less"

# Reload tmux config
bind R source-file ~/.tmux.conf \; display "tmux config reloaded"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# New pane in same directory
bind '"' split-window    -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# =============================================================================
# Mobile comfort tweaks
# =============================================================================

bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

bind v copy-mode

set -g pane-border-lines heavy
set -g focus-events on
setw -g aggressive-resize on

# =============================================================================
# Tmux Plugin Manager + Resurrect
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'

run '~/.tmux/plugins/tpm/tpm'
